name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
        env:
          # Vercel 代理地址是公开配置；浏览器按来源访问，不注入任何访问口令。
          VITE_AGENT_PROXY_URL: https://bfu-smart-travel.vercel.app/api
          # 只有地图 JS Key 进入静态资源；安全密钥仅保存在 Vercel 服务端。
          VITE_AMAP_KEY: ${{ vars.AMAP_JS_KEY }}
          VITE_AMAP_PROXY_URL: https://bfu-smart-travel.vercel.app/_AMapService
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
