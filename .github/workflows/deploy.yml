name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # 公开站点统一通过 Cloudflare Worker 调用通义千问。
          # Worker 地址不是密钥，固定写入构建配置，避免漏配仓库变量导致前端退回直连。
          VITE_AGENT_PROXY_URL: https://bfu-smart-travel-agent.bfu-smart-travel-huang2026.workers.dev
          # 访问口令只从 GitHub Actions Secret/Variable 注入，不进入仓库。
          VITE_AGENT_PROXY_TOKEN: ${{ secrets.AGENT_PROXY_TOKEN || vars.AGENT_PROXY_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
