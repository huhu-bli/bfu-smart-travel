name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # 想让所有访客都能直接用 AI，就在这里注入自己的代理地址（见 README「让别人也能用」）。
          VITE_AGENT_PROXY_URL: ${{ vars.AGENT_PROXY_URL }}
          VITE_AGENT_PROXY_TOKEN: ${{ vars.AGENT_PROXY_TOKEN }}
          # 或者直接注入一把站方密钥（密钥会出现在网页源码里，仅适合免费额度场景）。
          VITE_AGENT_API_KEY: ${{ vars.AGENT_API_KEY }}
          VITE_AGENT_PROVIDER: ${{ vars.AGENT_PROVIDER }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
